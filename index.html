<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бантики Михнево от Маринки-Рыбки</title>
    <style>
        :root { 
            --primary: #ff8fa3; 
            --primary-dark: #f06292; 
            --secondary: #fff0f3;
            --text: #590d22; 
            --white: #fff; 
            --shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--secondary); color: var(--text); margin: 0; transition: background 0.3s; }
        
        header { background: var(--white); padding: 12px 20px; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo { text-align: center; flex-grow: 1; }
        h1 { margin: 0; color: var(--primary); font-size: 1.4rem; }
        .subtitle { margin: 0; font-size: 0.8rem; color: #999; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        
        .icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #bbb; transition: 0.3s; padding: 5px; position: relative; display: flex; align-items: center; gap: 5px; }
        .icon-btn:hover { color: var(--primary); }
        .badge { position: absolute; top: -2px; right: -6px; background: var(--primary-dark); color: white; font-size: 10px; font-weight: bold; border-radius: 50%; min-width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
        
        .user-info { font-size: 0.85rem; color: var(--primary-dark); font-weight: bold; margin-right: 5px; display: none; }
        .user-info.active { display: block; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        .admin-panel { display: none; background: var(--white); padding: 25px; border-radius: 15px; margin-bottom: 30px; box-shadow: var(--shadow); border: 2px solid var(--primary); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: 2px solid var(--primary); background: white; color: var(--text); border-radius: 25px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        
        button { transition: 0.2s; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-save:hover { opacity: 0.9; }
        .btn-cancel { background: #eee; color: #555; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
        .btn-del { background: #ffebee; color: #d32f2f; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        
        .order-card { background: #fffafc; border: 1px solid #ffd6e0; border-radius: 12px; padding: 18px; margin-bottom: 15px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .order-num { font-weight: bold; font-size: 1.1rem; }
        .order-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        .status-created { background: #fff3cd; color: #856404; }
        .status-assembly { background: #cce5ff; color: #004085; }
        .status-completed { background: #d4edda; color: #155724; }
        
        .order-client { font-size: 0.9rem; margin-bottom: 8px; }
        .order-items { font-size: 0.9rem; color: #555; border-top: 1px dashed #eee; padding-top: 8px; }
        .order-total { font-weight: bold; color: var(--primary-dark); margin-top: 8px; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .card { background: var(--white); border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img { width: 100%; height: 260px; object-fit: cover; background: #f5f5f5; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .card-title { font-size: 1.05rem; margin: 0; font-weight: 700; }
        .card-price { font-weight: bold; color: var(--primary-dark); white-space: nowrap; }
        .card-desc { font-size: 0.85rem; color: #666; flex-grow: 1; margin: 0 0 12px; }
        .btn-order-small { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-order-small:hover { background: var(--primary-dark); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--white); max-width: 600px; width: 100%; border-radius: 20px; overflow: hidden; position: relative; max-height: 90vh; display: flex; flex-direction: column; }
        .close-modal { position: absolute; top: 12px; right: 18px; font-size: 28px; cursor: pointer; color: #999; z-index: 10; background: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
        .modal-img { width: 100%; max-height: 350px; object-fit: contain; background: #fafafa; }
        .modal-video { width: 100%; max-height: 400px; background: #000; margin-top: 15px; border-radius: 10px; }
        .modal-body { padding: 25px; overflow-y: auto; }
        .modal-price { font-size: 1.7rem; color: var(--primary-dark); font-weight: bold; margin: 10px 0; }
        .modal-desc { line-height: 1.6; white-space: pre-wrap; color: #444; }
        
        .cart-item { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #f0f0f0; padding: 12px 0; }
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .cart-item-info { flex-grow: 1; }
        .cart-item-title { font-weight: bold; font-size: 0.95rem; }
        .cart-item-price { font-size: 0.85rem; color: #777; }
        .qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn { width: 28px; height: 28px; border: 1px solid var(--primary); background: white; color: var(--primary); border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .qty-btn:hover { background: var(--primary); color: white; }
        .qty-input { width: 45px; text-align: center; padding: 4px; }
        .cart-item-sum { font-weight: bold; min-width: 80px; text-align: right; }
        .cart-remove { background: none; border: none; font-size: 18px; cursor: pointer; color: #ccc; }
        .cart-remove:hover { color: #d32f2f; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; padding: 15px 0; border-top: 2px solid var(--primary); margin-top: 10px; }
        .checkout-section { background: #fffafc; border-radius: 12px; padding: 15px; margin-top: 10px; }
        
        .pwd-box { background: white; padding: 30px; border-radius: 15px; text-align: center; width: 320px; }
        .pwd-box input { margin: 15px 0; text-align: center; letter-spacing: 2px; }
        
        .toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: white; padding: 14px 28px; border-radius: 30px; z-index: 3000; opacity: 0; transition: 0.4s; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .empty-msg { text-align: center; grid-column: 1/-1; padding: 50px; color: #999; }
        
        .my-orders-list { margin-top: 15px; }
        .my-order-card { background: #f9f9f9; border-left: 4px solid var(--primary); padding: 15px; margin-bottom: 10px; border-radius: 8px; }

        .phone-input-wrapper { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .phone-prefix { background: #f5f5f5; padding: 10px; font-weight: bold; color: #666; border-right: 1px solid #ddd; }
        .phone-input-wrapper input { border: none; border-radius: 0; }

        @media(max-width: 600px) { 
            .form-row { grid-template-columns: 1fr; } 
            h1 { font-size: 1.1rem; } 
            .cart-item { flex-wrap: wrap; } 
            .header-actions { width: 100%; justify-content: space-between; margin-top: 5px; }
        }
    </style>
</head>
<body>

<header>
    <div style="width: 40px;"></div>
    <div class="logo">
        <h1>🎀 Бантики Михнево</h1>
        <p class="subtitle">от Маринки-Рыбки</p>
    </div>
    <div class="header-actions">
        <span class="user-info" id="userInfoDisplay"></span>
        <button class="icon-btn" onclick="toggleUserMenu()" title="Профиль">👤</button>
        <button class="icon-btn" onclick="openCart()" title="Корзина">🛒<span class="badge" id="cartBadge" style="display:none;">0</span></button>
        <button class="icon-btn" onclick="requestAdminAccess()" title="Админ" id="adminBtn">⚙️</button>
    </div>
</header>

<div class="container">
    <div class="admin-panel" id="adminPanel">
        <div class="tabs">
            <button class="tab-btn active" id="tabProductsBtn" onclick="showTab('products')">🎀 Товары</button>
            <button class="tab-btn" id="tabOrdersBtn" onclick="showTab('orders')">📦 Заказы <span id="ordersBadge"></span></button>
            <button class="tab-btn" id="tabSettingsBtn" onclick="showTab('settings')">🔒 Настройки</button>
        </div>
        
        <div id="tabProducts">
            <h2 id="formTitle">Добавить товар</h2>
            <input type="hidden" id="editId">
            <div class="form-row">
                <div class="form-group"><label>Название *</label><input type="text" id="pTitle"></div>
                <div class="form-group"><label>Цена (₽) *</label><input type="number" id="pPrice"></div>
            </div>
            <div class="form-group"><label>Краткое описание</label><input type="text" id="pShort"></div>
            <div class="form-group"><label>Полное описание</label><textarea id="pFull" rows="3"></textarea></div>
            <div class="form-group"><label>Фото товара</label><input type="file" id="pImg" accept="image/*"></div>
            <div class="form-group"><label>Видео товара (необязательно)</label><input type="file" id="pVideo" accept="video/*"></div>
            <div class="btn-group">
                <button class="btn-save" onclick="saveProduct()">💾 Сохранить</button>
                <button class="btn-cancel" onclick="resetForm()">Отмена</button>
                <button class="btn-del" id="btnDelete" style="display:none;" onclick="deleteProduct()">🗑 Удалить</button>
            </div>
        </div>

        <div id="tabOrders" style="display:none;">
            <h2>📦 Заказы покупателей</h2>
            <div id="ordersList"></div>
        </div>

        <div id="tabSettings" style="display:none;">
            <h2>🔒 Настройки сайта</h2>
            <div class="form-group">
                <label>Цвет фона сайта:</label>
                <input type="color" id="bgColorPicker" value="#fff0f3" onchange="changeBgColor(this.value)" style="height: 50px; cursor: pointer;">
            </div>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <h3>Смена пароля администратора</h3>
            <div class="form-group"><label>Текущий пароль:</label><input type="password" id="currentPwd"></div>
            <div class="form-group"><label>Новый пароль (мин. 4 символа):</label><input type="password" id="newPwd"></div>
            <button class="btn-save" onclick="changePassword()">💾 Сохранить пароль</button>
        </div>
    </div>

    <div class="products-grid" id="grid"></div>
</div>

<!-- Модальное окно: Просмотр товара -->
<div class="modal" id="viewModal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeViewModal()">&times;</span>
        <img src="" class="modal-img" id="mImg">
        <video id="mVideo" class="modal-video" controls style="display:none;"></video>
        <div class="modal-body">
            <h2 id="mTitle" style="margin:0;"></h2>
            <div class="modal-price" id="mPrice"></div>
            <div class="modal-desc" id="mDesc"></div>
            <div class="btn-group">
                <button class="btn-save" onclick="orderFromModal()">🛒 В корзину</button>
                <button id="btnEdit" class="btn-cancel" style="display:none;" onclick="startEditFromModal()">✏️ Редактировать</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно: Корзина -->
<div class="modal" id="cartModal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeCart()">&times;</span>
        <div class="modal-body">
            <h2 style="margin-top:0;">🛒 Корзина</h2>
            <div id="cartItems"></div>
            <div id="cartFooter"></div>
        </div>
    </div>
</div>

<!-- Модальное окно: Вход / Регистрация покупателя -->
<div class="modal" id="loginModal">
    <div class="pwd-box" style="width: 400px;">
        <h3>👤 Личный кабинет</h3>
        <div id="loginForm">
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">Введите данные, чтобы оформлять заказы и отслеживать их статус.</p>
            <div class="form-group" style="text-align: left;">
                <label>Фамилия *</label>
                <input type="text" id="loginLastName" placeholder="Иванова">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Телефон *</label>
                <div class="phone-input-wrapper">
                    <span class="phone-prefix">+7</span>
                    <input type="tel" id="loginPhone" placeholder="(999) 123-45-67" style="flex-grow: 1;">
                </div>
            </div>
            <div class="btn-group" style="justify-content:center; margin-top: 20px;">
                <button class="btn-save" onclick="performLogin()">Войти</button>
                <button class="btn-cancel" onclick="closeLoginModal()">Отмена</button>
            </div>
        </div>
        <div id="profileMenu" style="display:none;">
            <p style="font-size: 1rem; margin-bottom: 15px;">Вы вошли как: <b id="profileName"></b></p>
            <button class="btn-save" style="width:100%; margin-bottom:10px;" onclick="openMyOrders()">📦 Мои заказы</button>
            <button class="btn-del" style="width:100%;" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>
</div>

<!-- Модальное окно: Мои заказы (для покупателя) -->
<div class="modal" id="myOrdersModal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeMyOrders()">&times;</span>
        <div class="modal-body">
            <h2 style="margin-top:0;">📦 Мои заказы</h2>
            <div id="myOrdersList" class="my-orders-list"></div>
        </div>
    </div>
</div>

<!-- Модальное окно: Пароль админа -->
<div class="modal" id="pwdModal">
    <div class="pwd-box">
        <h3>🔒 Вход для администратора</h3>
        <input type="password" id="pwdInput" placeholder="Пароль" onkeypress="if(event.key==='Enter') checkPassword()">
        <div class="btn-group" style="justify-content:center;">
            <button class="btn-save" onclick="checkPassword()">Войти</button>
            <button class="btn-cancel" onclick="closePwdModal()">Отмена</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// ⚙️ НАСТРОЙКИ
// ============================================================
const ORDER_EMAIL = "marina.rybalchenko1986@gmail.com";
let adminPassword = localStorage.getItem('adminPassword') || "Qwerty";

const savedBg = localStorage.getItem('siteBgColor');
if (savedBg) {
    document.documentElement.style.setProperty('--secondary', savedBg);
    document.getElementById('bgColorPicker').value = savedBg;
}

let products = JSON.parse(localStorage.getItem('bowsProducts')) || [];
let orders   = JSON.parse(localStorage.getItem('bowsOrders')) || [];
let cart     = JSON.parse(localStorage.getItem('bowsCart')) || [];
let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
let isAdmin  = false;
let currentViewId = null;

function saveProducts() { localStorage.setItem('bowsProducts', JSON.stringify(products)); }
function saveOrders() { localStorage.setItem('bowsOrders', JSON.stringify(orders)); }
function saveCart() { localStorage.setItem('bowsCart', JSON.stringify(cart)); }

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function updateCartBadge() {
    const c = cart.reduce((s, i) => s + i.qty, 0);
    const b = document.getElementById('cartBadge');
    b.innerText = c; b.style.display = c > 0 ? 'flex' : 'none';
}

function updateHeaderUI() {
    const info = document.getElementById('userInfoDisplay');
    if (currentUser) {
        info.innerText = `${currentUser.lastName}`;
        info.classList.add('active');
    } else {
        info.classList.remove('active');
    }
}

// ===== ПОКУПАТЕЛЬ: АВТОРИЗАЦИЯ =====
function toggleUserMenu() {
    const loginForm = document.getElementById('loginForm');
    const profileMenu = document.getElementById('profileMenu');
    
    if (currentUser) {
        loginForm.style.display = 'none';
        profileMenu.style.display = 'block';
        document.getElementById('profileName').innerText = `${currentUser.lastName}, +7${currentUser.phone}`;
    } else {
        loginForm.style.display = 'block';
        profileMenu.style.display = 'none';
    }
    
    document.getElementById('loginModal').style.display = 'flex';
}
function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

function performLogin() {
    const lastName = document.getElementById('loginLastName').value.trim();
    const phone = document.getElementById('loginPhone').value.trim();
    if (!lastName || !phone) { alert('⚠️ Введите фамилию и телефон!'); return; }
    
    currentUser = { lastName, phone };
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    updateHeaderUI();
    closeLoginModal();
    showToast('✅ Вы успешно вошли!');
}

function logout() {
    currentUser = null;
    localStorage.removeItem('currentUser');
    updateHeaderUI();
    closeLoginModal();
    showToast('Вы вышли из аккаунта');
}

function openMyOrders() {
    if (!currentUser) {
        alert('⚠️ Сначала войдите в аккаунт!');
        return;
    }
    
    const list = document.getElementById('myOrdersList');
    const myOrders = orders.filter(o => o.phone === currentUser.phone);
    
    if (myOrders.length === 0) {
        list.innerHTML = '<p class="empty-msg">У вас пока нет заказов 🌸</p>';
    } else {
        list.innerHTML = myOrders.map(o => {
            let statusClass = 'status-created';
            let statusText = '🆕 Оформлен';
            if (o.status === 'assembly') { statusClass = 'status-assembly'; statusText = '📦 В сборке'; }
            if (o.status === 'completed') { statusClass = 'status-completed'; statusText = '✅ Выполнен'; }
            
            return `
            <div class="my-order-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <b>Заказ №${o.number}</b>
                    <span class="order-status ${statusClass}">${statusText}</span>
                </div>
                <div style="font-size:0.85rem; color:#666; margin-bottom:8px;">📅 ${o.date}</div>
                <div style="font-size:0.9rem;">
                    ${o.items.map(i => `• ${i.title} (${i.qty} шт.) — ${i.sum} ₽`).join('<br>')}
                </div>
                <div style="font-weight:bold; color:var(--primary-dark); margin-top:8px;">Итого: ${o.total} ₽</div>
            </div>`;
        }).join('');
    }
    closeLoginModal();
    document.getElementById('myOrdersModal').style.display = 'flex';
}
function closeMyOrders() { document.getElementById('myOrdersModal').style.display = 'none'; }

// ===== КАТАЛОГ =====
function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    if (products.length === 0) { grid.innerHTML = '<p class="empty-msg">Каталог пока пуст 🌸</p>'; return; }
    products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openViewModal(p.id);
        card.innerHTML = `
            <img src="${p.image}" class="card-img" alt="${p.title}">
            <div class="card-body">
                <div class="card-header">
                    <h3 class="card-title">${p.title}</h3>
                    <span class="card-price">${p.price} ₽</span>
                </div>
                <p class="card-desc">${p.short || ''}</p>
                <button class="btn-order-small" onclick="event.stopPropagation(); addToCart(${p.id})">В корзину 🎀</button>
            </div>`;
        grid.appendChild(card);
    });
}

function openViewModal(id) {
    const p = products.find(x => x.id == id);
    if (!p) return;
    currentViewId = id;
    document.getElementById('mImg').src = p.image;
    document.getElementById('mTitle').innerText = p.title;
    document.getElementById('mPrice').innerText = p.price + ' ₽';
    document.getElementById('mDesc').innerText = p.full || p.short || 'Описание скоро появится...';
    document.getElementById('btnEdit').style.display = isAdmin ? 'inline-block' : 'none';
    
    const videoEl = document.getElementById('mVideo');
    if (p.video) {
        videoEl.src = p.video;
        videoEl.style.display = 'block';
    } else {
        videoEl.style.display = 'none';
        videoEl.src = '';
    }
    
    document.getElementById('viewModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}
function closeViewModal() { 
    document.getElementById('viewModal').style.display = 'none'; 
    document.body.style.overflow = ''; 
    const videoEl = document.getElementById('mVideo');
    videoEl.pause();
    videoEl.src = '';
}
function orderFromModal() { if (currentViewId) { addToCart(currentViewId); closeViewModal(); openCart(); } }

// ===== КОРЗИНА =====
function addToCart(id, qty = 1) {
    const p = products.find(x => x.id == id);
    if (!p) return;
    const e = cart.find(i => i.id == id);
    if (e) e.qty += qty;
    else cart.push({ id: p.id, title: p.title, price: Number(p.price), image: p.image, qty });
    saveCart(); updateCartBadge(); showToast('🎀 Товар добавлен в корзину!');
}
function changeQty(id, d) { const i = cart.find(x => x.id == id); if (!i) return; i.qty += d; if (i.qty < 1) i.qty = 1; saveCart(); updateCartBadge(); renderCart(); }
function setQty(id, v) { const i = cart.find(x => x.id == id); if (!i) return; const q = parseInt(v); i.qty = (isNaN(q) || q < 1) ? 1 : q; saveCart(); updateCartBadge(); renderCart(); }
function removeFromCart(id) { cart = cart.filter(i => i.id != id); saveCart(); updateCartBadge(); renderCart(); }
function cartTotal() { return cart.reduce((s, i) => s + i.price * i.qty, 0); }

function openCart() { 
    if (!currentUser) {
        alert('⚠️ Пожалуйста, сначала войдите в аккаунт (нажмите 👤 вверху), чтобы оформить заказ!');
        toggleUserMenu();
        return;
    }
    renderCart(); 
    document.getElementById('cartModal').style.display = 'flex'; 
    document.body.style.overflow = 'hidden'; 
}
function closeCart() { document.getElementById('cartModal').style.display = 'none'; document.body.style.overflow = ''; }

function renderCart() {
    const itemsEl = document.getElementById('cartItems');
    const footerEl = document.getElementById('cartFooter');
    if (cart.length === 0) { itemsEl.innerHTML = '<p class="empty-msg">Корзина пуста 🛒</p>'; footerEl.innerHTML = ''; return; }
    itemsEl.innerHTML = cart.map(i => `
        <div class="cart-item">
            <img src="${i.image}" alt="">
            <div class="cart-item-info">
                <div class="cart-item-title">${i.title}</div>
                <div class="cart-item-price">${i.price} ₽ × ${i.qty} шт.</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty(${i.id}, -1)">−</button>
                <input class="qty-input" type="number" min="1" value="${i.qty}" onchange="setQty(${i.id}, this.value)">
                <button class="qty-btn" onclick="changeQty(${i.id}, 1)">+</button>
            </div>
            <div class="cart-item-sum">${i.price * i.qty} ₽</div>
            <button class="cart-remove" onclick="removeFromCart(${i.id})">🗑</button>
        </div>`).join('');
    footerEl.innerHTML = `
        <div class="cart-total"><span>Итого:</span><span>${cartTotal()} ₽</span></div>
        <div class="checkout-section">
            <h3 style="margin-top:0;">Данные для заказа</h3>
            <p style="font-size:0.9rem; color:#666; margin-bottom:10px;">Заказ будет оформлен на: <b>${currentUser.lastName}, +7${currentUser.phone}</b></p>
            <button class="btn-save" style="width:100%; font-size:16px;" onclick="checkout()">✅ Подтвердить и создать заказ</button>
        </div>`;
}

// ===== ОФОРМЛЕНИЕ ЗАКАЗА =====
async function checkout() {
    if (!currentUser) { alert('Ошибка: вы не авторизованы!'); return; }

    let counter = (parseInt(localStorage.getItem('bowsOrderCounter')) || 0) + 1;
    localStorage.setItem('bowsOrderCounter', counter);

    const order = {
        number: counter,
        date: new Date().toLocaleString('ru-RU'),
        lastName: currentUser.lastName,
        phone: currentUser.phone,
        items: cart.map(i => ({ title: i.title, price: i.price, qty: i.qty, sum: i.price * i.qty })),
        total: cartTotal(), 
        status: 'created'
    };

    let sent = false;
    try {
        const res = await fetch(`https://formsubmit.co/ajax/${ORDER_EMAIL}`, {
            method: "POST",
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
                _subject: `🎀 Новый заказ №${order.number} — Бантики Михнево`,
                _template: 'table',
                _captcha: 'false',
                'Номер заказа': order.number,
                'Дата': order.date,
                'Клиент': `${order.lastName}`,
                'Телефон': `+7${order.phone}`,
                'Состав заказа': order.items.map(i => `${i.title} — ${i.qty} шт. × ${i.price} ₽ = ${i.sum} ₽`).join(' | '),
                'ИТОГО': `${order.total} ₽`,
                'Статус': 'Оформлен'
            })
        });
        sent = res.ok;
    } catch (e) { console.error(e); }

    orders.unshift(order); saveOrders();
    cart = []; saveCart(); updateCartBadge(); renderOrdersBadge(); closeCart();

    if (sent) alert(`🎉 Спасибо, ${currentUser.lastName}!\n\nВаш заказ №${order.number} оформлен и отправлен Маринке-Рыбки!\nВы можете отслеживать его статус в разделе "👤 → Мои заказы".`);
    else alert(`Спасибо! Заказ №${order.number} оформлен.`);
}

// ===== АДМИН: ДОСТУП И НАСТРОЙКИ =====
function requestAdminAccess() {
    if (isAdmin) { toggleAdminPanel(); return; }
    document.getElementById('pwdModal').style.display = 'flex';
    document.getElementById('pwdInput').value = '';
    setTimeout(() => document.getElementById('pwdInput').focus(), 100);
}
function checkPassword() {
    if (document.getElementById('pwdInput').value === adminPassword) {
        isAdmin = true; closePwdModal();
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('adminBtn').style.color = 'var(--primary)';
        renderOrdersBadge(); showToast('✅ Добро пожаловать, Маринка-Рыбка!');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } else { alert('❌ Неверный пароль!'); document.getElementById('pwdInput').value = ''; }
}
function closePwdModal() { document.getElementById('pwdModal').style.display = 'none'; }
function toggleAdminPanel() {
    const p = document.getElementById('adminPanel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
    if (p.style.display === 'block') window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showTab(tab) {
    document.getElementById('tabProducts').style.display = tab === 'products' ? 'block' : 'none';
    document.getElementById('tabOrders').style.display = tab === 'orders' ? 'block' : 'none';
    document.getElementById('tabSettings').style.display = tab === 'settings' ? 'block' : 'none';
    
    document.getElementById('tabProductsBtn').classList.toggle('active', tab === 'products');
    document.getElementById('tabOrdersBtn').classList.toggle('active', tab === 'orders');
    document.getElementById('tabSettingsBtn').classList.toggle('active', tab === 'settings');
    
    if (tab === 'orders') renderOrders();
}

function changeBgColor(color) {
    document.documentElement.style.setProperty('--secondary', color);
    localStorage.setItem('siteBgColor', color);
    showToast('🎨 Цвет фона изменён!');
}

function changePassword() {
    const current = document.getElementById('currentPwd').value;
    const newPwd = document.getElementById('newPwd').value;
    if (current !== adminPassword) { alert("❌ Неверный текущий пароль!"); return; }
    if (newPwd.length < 4) { alert("⚠️ Новый пароль должен быть не менее 4 символов!"); return; }
    adminPassword = newPwd;
    localStorage.setItem('adminPassword', adminPassword);
    alert("✅ Пароль успешно изменён!");
    document.getElementById('currentPwd').value = '';
    document.getElementById('newPwd').value = '';
}

// ===== АДМИН: ЗАКАЗЫ =====
function renderOrdersBadge() {
    const n = orders.filter(o => o.status === 'created').length;
    document.getElementById('ordersBadge').innerText = n > 0 ? `(${n})` : '';
}

function getStatusUI(status) {
    if (status === 'created') return { class: 'status-created', text: '🆕 Оформлен' };
    if (status === 'assembly') return { class: 'status-assembly', text: '📦 В сборке' };
    if (status === 'completed') return { class: 'status-completed', text: '✅ Выполнен' };
    return { class: 'status-created', text: '🆕 Оформлен' };
}

function renderOrders() {
    const list = document.getElementById('ordersList');
    if (orders.length === 0) { list.innerHTML = '<p class="empty-msg">Заказов пока нет 📭</p>'; return; }
    list.innerHTML = orders.map(o => {
        const st = getStatusUI(o.status);
        return `
        <div class="order-card">
            <div class="order-header">
                <span class="order-num">Заказ №${o.number}</span>
                <span class="order-status ${st.class}">${st.text}</span>
            </div>
            <div class="order-client">📅 ${o.date} | 👤 ${o.lastName} | 📞 +7${o.phone}</div>
            <div class="order-items">${o.items.map(i => `• ${i.title} — ${i.qty} шт. × ${i.price} ₽ = <b>${i.sum} ₽</b>`).join('<br>')}</div>
            <div class="order-total">Итого: ${o.total} ₽</div>
            <div class="btn-group">
                <select onchange="updateOrderStatus(${o.number}, this.value)" style="padding:8px; border-radius:6px; border:1px solid #ddd;">
                    <option value="created" ${o.status === 'created' ? 'selected' : ''}>🆕 Оформлен</option>
                    <option value="assembly" ${o.status === 'assembly' ? 'selected' : ''}>📦 В сборке</option>
                    <option value="completed" ${o.status === 'completed' ? 'selected' : ''}>✅ Выполнен</option>
                </select>
                <button class="btn-del" onclick="deleteOrder(${o.number})">🗑 Удалить</button>
            </div>
        </div>`;
    }).join('');
}

function updateOrderStatus(num, newStatus) {
    const o = orders.find(x => x.number == num);
    if (o) { 
        o.status = newStatus; 
        saveOrders(); 
        renderOrders(); 
        renderOrdersBadge(); 
        showToast(`Статус заказа №${num} обновлён!`);
    }
}

function deleteOrder(num) { 
    if (confirm(`Удалить заказ №${num}?`)) { 
        orders = orders.filter(x => x.number != num); 
        saveOrders(); 
        renderOrders(); 
        renderOrdersBadge(); 
    } 
}

// ===== АДМИН: ТОВАРЫ =====
async function saveProduct() {
    const id = document.getElementById('editId').value;
    const title = document.getElementById('pTitle').value.trim();
    const price = document.getElementById('pPrice').value.trim();
    const short = document.getElementById('pShort').value.trim();
    const full = document.getElementById('pFull').value.trim();
    const fi = document.getElementById('pImg');
    const fv = document.getElementById('pVideo');
    
    if (!title || !price) { alert('⚠️ Название и цена обязательны!'); return; }
    
    let image = null;
    let video = null;
    
    if (fi.files && fi.files[0]) {
        image = await new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsDataURL(fi.files[0]); });
    }
    
    if (fv.files && fv.files[0]) {
        video = await new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsDataURL(fv.files[0]); });
    }
    
    if (id) {
        const p = products.find(x => x.id == id);
        if (p) { 
            p.title = title; 
            p.price = Number(price); 
            p.short = short; 
            p.full = full; 
            if (image) p.image = image;
            if (video) p.video = video;
        }
    } else {
        products.push({ 
            id: Date.now(), 
            title, 
            price: Number(price), 
            short, 
            full, 
            image: image || 'https://placehold.co/400x400/ff8fa3/white?text=Нет+фото',
            video: video || null
        });
    }
    saveProducts(); 
    resetForm(); 
    render(); 
    showToast('💾 Сохранено!');
}

function deleteProduct() {
    const id = document.getElementById('editId').value;
    if (id && confirm('Удалить товар?')) { 
        products = products.filter(p => p.id != id); 
        cart = cart.filter(i => i.id != id); 
        saveProducts(); 
        saveCart(); 
        updateCartBadge(); 
        resetForm(); 
        render(); 
    }
}

function startEdit(id) {
    const p = products.find(x => x.id == id); 
    if (!p) return;
    document.getElementById('editId').value = p.id;
    document.getElementById('pTitle').value = p.title;
    document.getElementById('pPrice').value = p.price;
    document.getElementById('pShort').value = p.short;
    document.getElementById('pFull').value = p.full;
    document.getElementById('pImg').value = '';
    document.getElementById('pVideo').value = '';
    document.getElementById('formTitle').innerText = '✏️ Редактирование товара';
    document.getElementById('btnDelete').style.display = 'block';
    showTab('products');
    document.getElementById('adminPanel').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startEditFromModal() { 
    if (currentViewId) { 
        closeViewModal(); 
        startEdit(currentViewId); 
    } 
}

function resetForm() {
    ['editId','pTitle','pPrice','pShort','pFull','pImg','pVideo'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('formTitle').innerText = 'Добавить товар';
    document.getElementById('btnDelete').style.display = 'none';
}

window.onclick = e => {
    if (e.target.id === 'viewModal') closeViewModal();
    if (e.target.id === 'cartModal') closeCart();
    if (e.target.id === 'loginModal') closeLoginModal();
    if (e.target.id === 'myOrdersModal') closeMyOrders();
    if (e.target.id === 'pwdModal') closePwdModal();
};

updateHeaderUI();
render(); 
updateCartBadge();
</script>
</body>
